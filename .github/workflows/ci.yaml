name: Validate
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
      GOMAXPROCS: '2'
      RIVER_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/helpers_test?sslmode=disable
      DEPS_TEST_REDIS_ADDR: 127.0.0.1:6379
      DEPS_TEST_SENTINEL_ADDR: 127.0.0.1:26379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # Docker Hub rate-limits anonymous pulls: scripts/ci-pull-image.sh pulls
      # the official images from its mirrors, with retries. Steps, not
      # services, so a failed pull is retried.
      - name: Start PostgreSQL
        run: |
          image="$(scripts/ci-pull-image.sh postgres:18-alpine)"
          docker run -d --pull never --name postgres -p 127.0.0.1:5432:5432 \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=helpers_test "$image"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          # Build and scan on the latest patched Go 1.26; go.mod keeps 1.26.6
          # as the consumers' floor.
          go-version: '1.26.9'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Start Redis and Sentinel
        run: |
          image="$(scripts/ci-pull-image.sh redis:8-alpine)"
          docker run -d --pull never --name redis -p 127.0.0.1:6379:6379 "$image"
          ip="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' redis)"
          docker run -d --pull never --name sentinel -p 127.0.0.1:26379:26379 --entrypoint sh "$image" -c \
            "printf 'port 26379\nsentinel monitor mymaster $ip 6379 1\n' > /tmp/s.conf && exec redis-sentinel /tmp/s.conf"
          for i in $(seq 1 30); do
            docker exec sentinel redis-cli -p 26379 sentinel get-master-addr-by-name mymaster | grep -q "$ip" && exit 0
            sleep 1
          done
          docker logs sentinel
          exit 1
      - name: Wait for PostgreSQL
        run: timeout 60 bash -c 'until docker exec postgres pg_isready -h 127.0.0.1 -U postgres -d helpers_test; do sleep 1; done'
      - run: bash scripts/check.sh
  injection-scan:
    uses: ./.github/workflows/injection-scan.yml
